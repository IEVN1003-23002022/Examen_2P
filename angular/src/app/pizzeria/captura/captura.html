<div class="p-4 bg-white border border-gray-400">
  <form [formGroup]="formulario">

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Nombre:</label>
        <input type="text" formControlName="nombre"
          (input)="pizzeriaService.cliente.nombre = formulario.value.nombre"
          placeholder="Nombre del cliente"
          class="bg-white border border-gray-400 text-xs p-1.5 w-full focus:outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Dirección:</label>
        <input type="text" formControlName="direccion"
          (input)="pizzeriaService.cliente.direccion = formulario.value.direccion"
          placeholder="Calle y número"
          class="bg-white border border-gray-400 text-xs p-1.5 w-full focus:outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Teléfono:</label>
        <input type="text" formControlName="telefono"
          (input)="pizzeriaService.cliente.telefono = formulario.value.telefono"
          placeholder="Teléfono de contacto"
          class="bg-white border border-gray-400 text-xs p-1.5 w-full focus:outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Fecha de compra:</label>
        <input type="date" formControlName="fecha"
          (change)="pizzeriaService.cliente.fecha = formulario.value.fecha"
          class="bg-white border border-gray-400 text-xs p-1.5 w-full focus:outline-none">
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

      <fieldset class="border border-gray-400 p-3 bg-gray-50">
        <legend class="text-xs font-semibold text-gray-700 px-1 uppercase tracking-wider">Tamaño Pizza</legend>
        <div class="flex flex-col gap-2 text-xs text-gray-700 mt-1">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" formControlName="tamano" value="Chica"> Chica $40
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" formControlName="tamano" value="Mediana"> Mediana $80
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" formControlName="tamano" value="Grande"> Grande $120
          </label>
        </div>
      </fieldset>

      <fieldset class="border border-gray-400 p-3 bg-gray-50">
        <legend class="text-xs font-semibold text-gray-700 px-1 uppercase tracking-wider">Ingredientes</legend>
        <div class="flex flex-col gap-2 text-xs text-gray-700 mt-1">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" formControlName="jamon"> Jamón $10
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" formControlName="pina"> Piña $10
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" formControlName="champinones"> Champiñones $10
          </label>
        </div>
      </fieldset>

      <div class="border border-gray-400 p-3 bg-gray-50 flex flex-col justify-between">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Num. de Pizzas:</label>
          <input type="number" formControlName="numPizzas" min="1"
            class="bg-white border border-gray-400 text-xs p-1.5 w-full focus:outline-none">
        </div>

        <div class="mt-3">
          <button type="button" (click)="agregar()"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium text-xs py-2 px-4 transition">
            Agregar Pizza
          </button>
        </div>
      </div>

    </div>

  </form>
</div>
