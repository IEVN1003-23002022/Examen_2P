<div class="p-4 bg-white border border-gray-400 h-full flex flex-col justify-between">

  <fieldset class="border border-gray-400 p-4 flex-1 flex flex-col justify-between bg-gray-50">
    <legend class="text-xs font-semibold text-gray-700 px-2 uppercase tracking-wide">Ventas del día</legend>

    <div class="my-3 space-y-2 text-center overflow-y-auto max-h-36">
      <p *ngFor="let v of ventasMostradas" class="font-bold text-base text-gray-800">
        {{ v.nombre }} &nbsp; total &nbsp; ${{ v.total }}
      </p>
      <p *ngIf="ventasMostradas.length === 0" class="text-xs text-gray-500 py-2">
        No hay ventas registradas aún.
      </p>
    </div>

    <div class="mt-4 pt-3 border-t border-gray-300 text-center">
      <p class="font-bold text-base text-blue-700">
        Ventas totales del día: &nbsp; ${{ totalAcumulado }}
      </p>
    </div>
  </fieldset>

  <div class="mt-4 text-center">
    <button type="button" (click)="consultarVentas()"
      class="bg-blue-600 hover:bg-blue-700 text-white font-medium text-xs py-2 px-6 transition">
      Ventas totales por día
    </button>
  </div>

</div>
